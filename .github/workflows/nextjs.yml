# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Run every night
  schedule:
    - cron: '0 6,12,18 * * *'

  pull_request:
    branches: ['main']

  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install pnpm
        # Version comes from the packageManager field in package.json, so CI
        # and developers run the same pnpm. They have to: pnpm 10 and 11 write
        # incompatible patchedDependencies entries into the lockfile, and the
        # mismatch fails the frozen install here.
        uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      # The Next.js build cache also holds the fetch data cache, which the
      # 6-hourly cron refreshes. actions/cache skips the save on an exact key
      # hit, so the key has to miss every run or those responses are thrown
      # away: github.run_id never repeats, and restore-keys supplies the
      # previous run's cache.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
      # next-image-export-optimizer decides what to reuse from the hashes
      # file, so restoring the generated variants without it re-encodes
      # everything. remoteImagesForOptimization holds the downloaded remote
      # originals — staff headshots, and the article and event art from the
      # content repositories, which is the bulk of it. next.config.mjs and
      # remoteOptimizedImages.js both change what gets generated, so they
      # belong in the key, as does the optimizer patch, which changes the name
      # a downloaded file is stored under.
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: |
            public/images/**/nextImageExportOptimizer
            public/images/next-image-export-optimizer-hashes.json
            remoteImagesForOptimization
          key: ${{ runner.os }}-next-image-export-optimizer-${{ hashFiles('next.config.mjs', 'remoteOptimizedImages.js', 'patches/*.patch') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-next-image-export-optimizer-${{ hashFiles('next.config.mjs', 'remoteOptimizedImages.js', 'patches/*.patch') }}-
            ${{ runner.os }}-next-image-export-optimizer-
      - name: Build with Next.js
        run: |
          pnpm run build
          find ./out | sed -e "s/[^-][^\/]*\//  |/g" -e "s/|\([^ ]\)/|-\1/"
          printenv
      # The Kubernetes deployment pulls this artifact, so it has to outlive
      # the default single day.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
          retention-days: 90

  # Check every link in the built site; the job fails if any are broken.
  # Only links within the site are checked: external sites go down and
  # rate-limit often enough that checking them would fail PRs for nothing
  # (external-links.yml checks those daily).
  link-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      SITE_ROOT: ${{ github.workspace }}/_site
    steps:
      - name: Download built site
        uses: actions/download-artifact@v5
        with:
          name: github-pages
      - name: Extract built site
        run: |
          mkdir -p "$SITE_ROOT"
          tar -xf artifact.tar -C "$SITE_ROOT"
      # `public/doc/` is an archive of decades-old papers and manuals, served
      # as they were; their broken image references predate this site.
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --offline --no-progress
            --root-dir '${{ env.SITE_ROOT }}'
            --index-files index.html
            --fallback-extensions html
            --exclude-path '${{ env.SITE_ROOT }}/doc'
            '${{ env.SITE_ROOT }}/**/*.html'

  # Publish the built site at https://<pr>-chtc-website-nextjs-chtc.website-preview.chtc.io/
  # (CHTC/website-preview). The server authorizes the push with this run's OIDC
  # token, which PRs from forks don't get, so those are skipped.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: CHTC/website-preview/.github/workflows/push.yml@main

  # Deployment job if you are serving from GitHub Pages
  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref =='refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The second copy: CHTC/chtc.github.io, which the CS department's web server
  # serves as chtc.cs.wisc.edu.
  deploy-csl:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      SITE_ROOT: ${{ github.workspace }}/_site
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download built site
        uses: actions/download-artifact@v5
        with:
          name: github-pages
      - name: Extract built site
        run: |
          mkdir -p "$SITE_ROOT"
          tar -xf artifact.tar -C "$SITE_ROOT"
      - name: Deploy to CHTC/chtc.github.io
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
          ssh-add - <<< "$DEPLOY_KEY"
          .github/workflows/deploy-csl.sh "$SITE_ROOT"
