last_updated: '2026-09-23'
notes:
- HTCondor compares GPUs_DriverVersion as a real number, so a driver reporting CUDA support like "12.10" would sort BEFORE "12.9" -- not an issue for anything in this file today, but worth knowing if a future CUDA release hits a double-digit minor version.
frameworks:
  pytorch:
    1.0.1:
    - cuda_toolkit: '10.0'
      min_nvidia_driver_version: 550.54.14
      min_driver_cuda: '12.4'
      compute_capability:
        min: '6.0'
        max: '7.5'
        excluded: []
      n_compatible_gpus: 21
      chip_names:
      - P100
      - RTX 2080 Ti
      - RTX 8000
      condor_requirements: requirements = (GPUs_Capability >= 6.0) && (GPUs_Capability <= 7.5) && (GPUs_DriverVersion >= 12.4)
