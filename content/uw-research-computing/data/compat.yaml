        - RTX 8000
        - RTX PRO 6000 Blackwell Server Edition
        condor_requirements: |-
          gpus_minimum_capability = 6.0
          gpus_maximum_capability = 12.0
          gpus_minimum_runtime = 12.4
        notes:
        - 'Needs one extra step: PyTorch 1.13 doesn''t see the GPU when CUDA_VISIBLE_DEVICES lists GPU IDs (GPU-...), which is how HTCondor sets it (https://github.com/pytorch/pytorch/issues/90543). Our tests passed after converting the IDs to numbers before importing torch: look up each listed GPU''s index with NVIDIA''s NVML library (libnvidia-ml, through ctypes or the pynvml package; containers often lack nvidia-smi), then set CUDA_DEVICE_ORDER=PCI_BUS_ID and CUDA_VISIBLE_DEVICES to those indices. PyTorch 1.12 and 2.0+ don''t need it.'
        - This build has no native code for compute capability 9.0 and 12.0 (H200, RTX PRO 6000 Blackwell Server Edition). It still works there, but compiles its GPU code every time it starts, which took 27-36 minutes per job in our tests. A newer version avoids the delay.
