last_updated: '2026-10-30'
notes:
- HTCondor compares the gpus_* values in condor_requirements as numbers, so a CUDA version like 12.10 would count as lower than 12.9. No version in this file has a two-digit minor number yet.
- A forward_compatibility block means the entry worked on an older driver only because the tested container image includes NVIDIA's forward-compatibility libraries. Using the same image needs nothing extra. If you install the framework another way, such as pip or conda, also install NVIDIA's cuda-compat package (https://docs.nvidia.com/deploy/cuda-compatibility/). Forward compatibility works only on datacenter GPUs, not GeForce cards.
