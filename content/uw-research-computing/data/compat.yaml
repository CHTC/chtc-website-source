last_updated: '2026-10-23'
notes:
  - HTCondor compares these gpus_* attributes as real numbers, so a value like "12.10" would sort BEFORE "12.9" -- not an issue for anything in this file today, but worth knowing if a future CUDA release hits a double-digit minor version.
  - An entry with a forward_compatibility block worked on drivers whose own CUDA version is an older major release than its cuda_toolkit only through NVIDIA's CUDA forward-compatibility libraries, which the tested container images bundle. Running the same container needs nothing extra; installing the framework any other way (pip, conda) on such a driver needs the matching cuda-compat package installed too (https://docs.nvidia.com/deploy/cuda-compatibility/). Forward compatibility only works on datacenter GPUs, not GeForce cards.
frameworks:
