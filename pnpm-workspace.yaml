  # libvips/libheif/librsvg advisories fixed in 0.35.
  next-image-export-optimizer>sharp: ^0.35.5
patchedDependencies:
  next-image-export-optimizer@1.20.1: patches/next-image-export-optimizer@1.20.1.patch
